name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 0.3.2)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

jobs:
  build-native:
    name: Build native (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            artifact: tool-cli-windows-x86_64.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            ext: .exe
            artifact: tool-cli-windows-aarch64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            artifact: tool-cli-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
            artifact: tool-cli-linux-x86_64-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: ""
            artifact: tool-cli-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
            artifact: tool-cli-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            artifact: tool-cli-macos-aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (with targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools for aarch64 GNU
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install musl tools for x86_64 musl
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }} --bin tool-cli

      - name: Copy binary
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "${{ matrix.os }}" = "Windows" ] || [ "${{ matrix.ext }}" = ".exe" ]; then
            cp "target/${{ matrix.target }}/release/tool-cli${{ matrix.ext }}" "${{ matrix.artifact }}"
          else
            cp "target/${{ matrix.target }}/release/tool-cli" "${{ matrix.artifact }}"
            chmod +x "${{ matrix.artifact }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

  release:
    name: Create Release
    needs: [build-native, build-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: true
          files: artifacts/**/*
