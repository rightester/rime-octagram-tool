name: Create Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
      name:
        description: 'Release name (optional)'
        required: false
      body:
        description: 'Release notes (optional)'
        required: false
      draft:
        description: 'Create as draft (true/false)'
        required: false
        default: 'false'
      prerelease:
        description: 'Mark as prerelease (true/false)'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Add target and prepare environment (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          rustup target add ${{ matrix.target }}
          if [[ "${{ matrix.target }}" == *"musl"* ]]; then
            sudo apt-get update
            sudo apt-get install -y musl-tools build-essential gcc
          fi
        shell: bash

      - name: Add target (Windows)
        if: runner.os == 'Windows'
        run: |
          rustup target add ${{ matrix.target }}
        shell: powershell

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: |
          cargo build --release --target ${{ matrix.target }} --bin tool-cli
          out="target/${{ matrix.target }}/release/tool-cli"
          mkdir -p dist
          cp "$out" "dist/tool-cli-${{ matrix.target }}"
          chmod +x "dist/tool-cli-${{ matrix.target }}"
        shell: bash

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --release --target ${{ matrix.target }} --bin tool-cli
          $out = "target/${{ matrix.target }}/release/tool-cli.exe"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item $out "dist/tool-cli-${{ matrix.target }}.exe"
        shell: powershell

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tool-cli-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release and upload assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.name }}
          body: ${{ github.event.inputs.body }}
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.prerelease }}
          files: dist/*
